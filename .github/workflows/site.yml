name: Check and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax-check every script
        run: for f in js/*.js; do node --check "$f" || exit 1; done
      - name: The single-file build is up to date
        run: |
          python3 tools/build-single.py
          git diff --exit-code dist/ || { echo 'Run python3 tools/build-single.py and commit dist/'; exit 1; }
      - name: Every script and stylesheet referenced by index.html exists
        run: |
          grep -oE '(src|href)="(js|css)/[^"]+"' index.html | sed -E 's/.*="([^"]+)"/\1/' | while read f; do
            test -f "$f" || { echo "Missing $f"; exit 1; }
          done

  publish:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
